[package]
name = "watchsync"
version = "0.5.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
bytes = "1"
hex = "0.4.3"
hmac = "0.12"
iroh = "1.4.1"
md-5 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }

[workspace]
members = [".", "desktop/src-tauri"]
